<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be More Moslem</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">



    <div class="container mb-5">
        <!-- City and Date Selection -->
        <div class="d-flex justify-content-end mt-3">
            <form class="d-flex" id="searchForm">
                <select name="city" id="citySelect" class="form-select form-select-sm me-2 my-auto" required>
                    <option value="" selected disabled hidden>Pilih Kota</option>
                    <!-- Options populated by JS -->
                </select>
                <input type="date" class="form-control form-control-sm me-2 my-auto" id="dateInput" name="date"
                    required>
                <button class="btn btn-outline-success" type="submit">Submit</button>
            </form>
        </div>

        <!-- Prayer Times Section -->
        <div id="prayerTimesContainer">
            <div class="div text-center mt-4">
                <h4 id="headerCity"></h4>
                <h4 id="headerDate"></h4>
            </div>

            <!-- Single Day Table -->
            <div class="d-flex justify-content-center mt-4">
                <div class="w-75 table-responsive-sm">
                    <table class="table table-borderless text-center">
                        <thead>
                            <tr>
                                <th>Imsyak</th>
                                <th>Shubuh</th>
                                <th>Terbit</th>
                                <th>Dhuha</th>
                                <th>Dzuhur</th>
                                <th>Ashr</th>
                                <th>Maghrib</th>
                                <th>Isya</th>
                            </tr>
                        </thead>
                        <tbody id="singleDayRow">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Monthly Table -->
            <div class="text-center mt-4">
                <h4 id="headerMonth"></h4>
            </div>
            <div class="d-flex justify-content-center mt-4">
                <div class="table-responsive">
                    <table class="table table-striped table-hover text-center">
                        <thead>
                            <tr>
                                <th>Tanggal</th>
                                <th>Imsyak</th>
                                <th>Shubuh</th>
                                <th>Terbit</th>
                                <th>Dhuha</th>
                                <th>Dzuhur</th>
                                <th>Ashr</th>
                                <th>Maghrib</th>
                                <th>Isya</th>
                            </tr>
                        </thead>
                        <tbody id="monthlyRows">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <hr>

        <!-- Random Ayah Section -->
        <div class="text-center mt-4">
            <h4>Ayat Hari Ini</h4>
            <div id="ayahContainer">
                <h6 id="ayahHeader">Loading...</h6>
                <div class="box text-center">
                    <div class="arab text-center" id="ayahArab"></div>
                    <p class="text-muted mt-2" id="ayahRead"></p>
                    <p id="ayahTranslation"></p>
                </div>
                <div>
                    <audio id="ayahAudio" controls></audio>
                </div>
            </div>
        </div>

        <hr>

        <!-- Random Dua Section -->
        <div class="text-center mt-4">
            <h4>Doa Hari Ini</h4>
            <div id="duaContainer">
                <h6 id="duaHeader">Loading...</h6>
                <div class="box text-center">
                    <div class="arab text-center" id="duaArab"></div>
                    <p class="text-muted mt-2" id="duaLatin"></p>
                    <p id="duaTranslation"></p>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-light text-center">
        <div class="container">
            <span class="text-muted">© 2026 <a href="https://github.com/krisnawar" target="_blank"
                    class="text-muted text-decoration-none">krisnawar at GitHub</a></span>
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App JS -->
    <script src="app.js"></script>
</body>

</html>
