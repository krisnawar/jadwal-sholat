<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Sholat Indonesia</title>
    <meta name="description"
        content="Jadwal Sholat akurat seluruh kota di Indonesia, Pilihan ayat Al Quran dengan terjemahan dan audio, serta kumpulan doa harian. Cek waktu sholat hari ini dengan mudah.">
    <meta name="keywords"
        content="jadwal sholat, waktu sholat, imsyakiyah, adzan, quran online, baca quran, doa harian, jadwal puasa, indonesia, jakarta, bandung, surabaya">
    <meta name="author" content="Krisna Wardhana">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Jadwal Sholat Indonesia">
    <meta property="og:description"
        content="Jadwal Sholat akurat, Ayat Al Quran Pilihan, dan Doa Harian. Developed by Krisna Wardhana.">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Jadwal Sholat Indonesia">
    <meta property="twitter:description"
        content="Jadwal Sholat akurat, Ayat Al Quran Pilihan, dan Doa Harian. Developed by Krisna Wardhana.">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">



    <div class="container mb-5">
        <!-- Theme Toggle & City/Date Selection -->
        <div class="d-flex justify-content-between align-items-center mt-3">
            <div>
                <button class="btn btn-outline-secondary btn-sm rounded-circle" id="themeToggle"
                    aria-label="Toggle Dark Mode">
                    <i class="bi bi-moon-fill" id="themeIcon"></i>
                </button>
            </div>
            <form class="d-flex" id="searchForm">
                <select name="city" id="citySelect" class="form-select form-select-sm me-2 my-auto" required>
                    <option value="" selected disabled hidden>Pilih Kota</option>
                    <!-- Options populated by JS -->
                </select>
                <input type="date" class="form-control form-control-sm me-2 my-auto" id="dateInput" name="date"
                    required>
                <button class="btn btn-outline-success" type="submit">Submit</button>
            </form>
        </div>

        <!-- Prayer Times Section -->
        <div id="prayerTimesContainer">
            <div class="div text-center mt-4">
                <h4 id="headerCity"></h4>
                <h4 id="headerDate"></h4>
            </div>

            <!-- Single Day View (Grid) -->
            <div class="container mt-4">
                <div id="singleDayGrid" class="row justify-content-center g-2">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Monthly Table -->
            <div class="text-center mt-5">
                <h4 id="headerMonth"></h4>
            </div>
            <div class="d-flex justify-content-center mt-3">
                <div class="table-responsive border rounded shadow-sm p-2" style="max-height: 500px;">
                    <table class="table table-striped table-hover text-center mb-0">
                        <thead class="sticky-top bg-body">
                            <tr>
                                <th>Tanggal</th>
                                <th>Imsyak</th>
                                <th>Shubuh</th>
                                <th>Terbit</th>
                                <th>Dhuha</th>
                                <th>Dzuhur</th>
                                <th>Ashr</th>
                                <th>Maghrib</th>
                                <th>Isya</th>
                            </tr>
                        </thead>
                        <tbody id="monthlyRows">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <hr>

        <!-- Random Ayah Section -->
        <div class="text-center mt-4">
            <h4>Ayat Hari Ini</h4>
            <div id="ayahContainer">
                <h6 id="ayahHeader">Loading...</h6>
                <div class="box text-center">
                    <div class="arab text-center" id="ayahArab"></div>
                    <p class="text-muted mt-2" id="ayahRead"></p>
                    <p id="ayahTranslation"></p>
                </div>
                <div>
                    <audio id="ayahAudio" controls></audio>
                </div>
            </div>
        </div>

        <hr>

        <!-- Random Dua Section -->
        <div class="text-center mt-4">
            <h4>Doa Hari Ini</h4>
            <div id="duaContainer">
                <h6 id="duaHeader">Loading...</h6>
                <div class="box text-center">
                    <div class="arab text-center" id="duaArab"></div>
                    <p class="text-muted mt-2" id="duaLatin"></p>
                    <p id="duaTranslation"></p>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-body-tertiary text-center border-top">
        <div class="container">
            <p class="mb-1 text-muted">
                Developed with <i class="bi bi-heart-fill text-danger mx-1" style="font-size: 0.8rem;"></i> by
                <a href="https://github.com/krisnawar" target="_blank"
                    class="text-decoration-none fw-bold text-body">Krisna Wardhana</a>
            </p>
            <div class="mt-2">
                <a href="https://github.com/krisnawar" target="_blank"
                    class="btn btn-outline-secondary btn-sm rounded-pill px-3 shadow-sm">
                    <i class="bi bi-github me-1"></i> Follow on GitHub
                </a>
            </div>
            <p class="mt-3 mb-0 text-muted small">
                &copy; 2026 Jadwal Sholat Indonesia
            </p>
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App JS -->
    <script src="app.js"></script>

    <!-- 
        Data provided by:
        - Aladhan API (Prayer Times & Hijri Date): https://aladhan.com/prayer-times-api
        - Al Quran Cloud (Ayah): https://alquran.cloud/api
        - ipapi.co (Location): https://ipapi.co/
    -->
</body>

</html>
